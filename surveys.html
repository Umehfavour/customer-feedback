</head>

  <div class="sidebar-backdrop"></div>

  <aside class="sidebar">

      <div class="brand-mark">FP</div>
      <div>
        <div class="brand-text-name">FeedbackPro</div>
        <div class="brand-text-sub">SaaS Platform</div>
      </div>
    </div>

    <nav class="sidebar-nav">
      <a class="nav-link" href="index.html">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        Dashboard
      </a>
      <a class="nav-link active" href="surveys.html">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
        Surveys
      </a>
      <a class="nav-link" href="feedback.html">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-8.5 8.5 8.5 8.5 0 0 1-4-1L3 20l1-5.5A8.38 8.38 0 0 1 3 11.5 8.5 8.5 0 0 1 11.5 3 8.38 8.38 0 0 1 21 11.5Z"/></svg>
        Feedback
      </a>
      <a class="nav-link" href="#">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Customers
      </a>
      <a class="nav-link" href="settings.html">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
        Settings
      </a>
    </nav>

    <div class="sidebar-upgrade">
      <button class="btn-upgrade">Upgrade Plan</button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="menu-toggle" aria-label="Toggle menu">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <span class="topbar-title">Survey Creator</span>
      <div class="topbar-search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" placeholder="Search…">
      </div>
      <div class="topbar-right">
        <a class="btn-primary" href="surveys.html">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
          <span class="btn-label">New Survey</span>
        </a>
        <div class="avatar">AM</div>
      </div>
    </header>

    <main class="page">
      <div class="page-header">
        <h1>Create Survey</h1>
        <p>Build your custom feedback form.</p>
      </div>

      <div class="survey-grid">
        <!-- Builder -->
        <section class="card">
          <div class="card-pad">
            <div class="field">
              <label for="surveyTitle">Survey Title</label>
              <input id="surveyTitle" type="text" placeholder="e.g., Customer Satisfaction Q3">
            </div>

            <div class="question-block">
              <div class="question-block-head">
                <span class="q-number">1</span>
                <span class="q-number-label">Question 1</span>
              </div>

              <div class="field">
                <label for="qText">Question Text</label>
                <input id="qText" type="text" placeholder="What did you think of our service?">
              </div>

              <div class="field" style="margin-bottom:0;">
                <label for="qType">Question Type</label>
                <select id="qType">
                  <option>Multiple Choice</option>
                  <option>Star Rating</option>
                  <option>Short Answer</option>
                  <option>Yes / No</option>
                </select>
              </div>
            </div>

            <a class="link-add" href="#">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
              Add Question
            </a>
          </div>
        </section>

        <!-- Preview -->
        <section class="preview-card">
          <div class="preview-card-head">
            <div class="eyebrow">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2.5 12C2.5 7 6.5 3 12 3s9.5 4 9.5 9-4 9-9.5 9c-1.6 0-3.1-.4-4.4-1L3 21l1-4.6c-.9-1.3-1.5-2.8-1.5-4.4Z"/></svg>
              Preview: Customer Satisfaction Q3
            </div>
            <h3>We value your feedback</h3>
          </div>
          <div class="preview-card-body">
            <p class="q">1. What did you think of our service?</p>

            <label class="radio-option"><input type="radio" name="prev"> Excellent</label>
            <label class="radio-option"><input type="radio" name="prev"> Good</label>
            <label class="radio-option"><input type="radio" name="prev"> Needs Improvement</label>

            <button class="btn-block disabled" disabled>Submit Feedback</button>
          </div>
        </section>
      </div>

      <div class="actions-end">
        <button class="btn-outline">Save Draft</button>
        <button class="btn-primary">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 3 18 9-18 9V3Z"/></svg>
          Publish Survey
        </button>
      </div>
    </main>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
